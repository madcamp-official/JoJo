name: Release

# 담당 A — GitHub Release 자동 배포(2026-07-31, 사용자 요청). v로 시작하는 태그를 push하면
# (예: git tag v0.1.0 && git push origin v0.1.0) Windows/macOS 설치 파일과 크롬 확장 zip을
# 빌드해 같은 태그의 GitHub Release에 올린다. electron-builder.yml 의 releaseType: draft
# 설정 때문에 릴리스는 초안(draft)으로만 만들어진다 — 실제 공개(Publish)는 GitHub에서
# 릴리스 노트를 확인/작성한 뒤 사람이 마지막으로 눌러야 한다.
#
# 사전 준비물(레포 설정에서 한 번만): Settings → Actions → General → Workflow permissions
# 에서 "Read and write permissions"가 켜져 있어야 기본 GITHUB_TOKEN 으로 릴리스 생성/에셋
# 업로드가 가능하다.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          # mac은 러너를 둘로 나눈다(2026-07-31, 인텔 맥 지원 추가) — Python 런타임이
          # CI 러너 자신의 아키텍처로 빌드돼서(setup-python-runtime.mjs), 한 러너에서
          # arm64/x64 dmg를 같이 만들면 한쪽엔 잘못된 아키텍처의 네이티브 바이너리(torch/
          # paddle 등)가 들어가 그 아키텍처에서 OCR이 죽는다 — 각자 자기 아키텍처 러너에서
          # 빌드해야 electron-builder.yml의 mac.target(arch 미지정)이 호스트 아키텍처로
          # 알아서 맞는 dmg를 만든다.
          - os: macos-latest # Apple Silicon(arm64) 호스티드 러너
            script: release:mac
          - os: macos-13 # GitHub 마지막 Intel(x64) 호스티드 러너
            script: release:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Python 엔진(레이아웃 감지/OCR) 런타임을 빌드 전에 준비한다(2026-07-31 추가) —
      # python/.venv 를 그대로 패키징하면 venv 가 CI 러너의 원본 Python 설치 경로를 계속
      # 참조해서 사용자 컴퓨터에서 실행이 안 된다(pythonServer.ts/setup-python-runtime.mjs
      # 상단 주석 참고). 대신 재배치 가능한 독립 배포판을 새로 받아 그 자리에 pip install
      # 한다 — 그래서 시스템 Python(actions/setup-python)도 필요 없다. 두 그룹을
      # 분리하는 이유(공용/NDLOCR-Lite)는 python/README.md.
      - run: node scripts/setup-python-runtime.mjs general
      - run: node scripts/setup-python-runtime.mjs ndlocr
      # electron-builder --publish always 가 이 릴리스(태그와 이름이 같은)에 설치 파일과
      # 업데이트 피드 메타데이터(latest.yml/latest-mac.yml)를 함께 올린다.
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 크롬 확장은 electron-builder 대상이 아니라 별도 job에서 zip으로 묶어 같은 릴리스에
  # 추가 에셋으로 올린다. build-desktop 이 먼저 릴리스(초안)를 만들어둔 뒤에 여기서는
  # 파일만 추가하도록 순서를 맞춘다(needs).
  build-extension:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run zip:ext
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/nuance-extension-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
