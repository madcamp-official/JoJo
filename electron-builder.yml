# electron-builder 패키징 설정 (담당 공동)
#
# appId 는 배포 후에도 절대 바꾸지 않는다 — OS 가 이 값(+productName)으로 앱을 식별하며,
# userData 경로(설정·API 키·자주쓰는질문 저장 위치)가 여기서 갈린다. 바꾸면 기존 사용자의
# 저장 데이터가 유실된 것처럼 보인다.
appId: com.nuance
productName: Nuance

directories:
  output: dist # 패키지 산출물(dmg/exe 등)
  buildResources: build # 아이콘 등 소스 에셋(build/icon.png)

# GitHub Releases 로 배포 + electron-updater 자동 업데이트 피드로 사용(2026-07-31, 사용자
# 요청). `electron-builder --publish always`(scripts: release:mac/release:win, 또는
# .github/workflows/release.yml)를 돌리면 이 저장소의 릴리스에 설치 파일 +
# latest.yml/latest-mac.yml(업데이트 피드 메타데이터)을 자동으로 올린다. releaseType 을
# draft 로 둬서, 빌드/업로드는 자동화하되 실제로 공개(Publish) 하는 건 GitHub 에서 릴리스
# 노트를 확인/작성한 뒤 사람이 마지막으로 누르게 한다 — 첫 배포라 빈 노트로 그대로
# 공개돼버리는 걸 방지.
publish:
  provider: github
  owner: madcamp-official
  repo: JoJo
  releaseType: draft

# 패키지에 포함할 파일 — electron-vite 산출물(out/**), package.json, 로컬 사전 번들(resources/**,
# scripts/ensure-resources.sh 로 생성됨). resources/** 가 빠지면 asarUnpack 대상 자체가 없어서
# JMdict/OEWN/CC-CEDICT 사전 조회가 배포판에서 전부 실패한다(2026-07-30 실측으로 확인된 버그).
files:
  - out/**/*
  - package.json
  - resources/**

# 사전 데이터는 용량이 크고(94MB) 텍스트/JSON 이라 asar 압축 이점이 없어 압축 해제 상태로 둔다
# (코드가 __dirname 기준 상대경로로 읽는데, asar 안에 있으면 fs 가 asar 를 투명하게 가로채 동일한
# 상대경로로 자동 리다이렉트해주므로 코드 변경 없이 그대로 동작한다).
asarUnpack:
  - resources/**

# Python 엔진(레이아웃 감지/OCR) — CI(release.yml)가 빌드 직전에
# scripts/setup-python-runtime.mjs 로 python/runtime, python/runtime-ndlocr 를 만들어둔다
# (2026-07-31, GitHub Release 배포에 Python 엔진 포함시키며 추가). asarUnpack 이 아니라
# extraResources 를 쓰는 이유 — venv/배포판 안의 실행 파일(python.exe 등)은 asar 안에서
# spawn 할 수 없어서 애초에 asar 밖(resources/ 바로 밑)에 둬야 한다. .venv*/는 사람이
# 로컬 개발용으로만 만드는 것(python/README.md)이라 여기서 제외 — 패키징에는 CI가 만든
# runtime*/ 만 들어간다(pythonServer.ts: PYTHON_ROOT 참고).
extraResources:
  - from: python
    to: python
    filter:
      - '**/*'
      - '!.venv/**'
      - '!.venv-ndlocr-test/**'
      - '!__pycache__/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'

mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  # 사설 배포(코드서명 인증서 없음) 기준. 정식 배포 시 hardenedRuntime+notarize 로 전환.
  identity: null

win:
  target:
    - nsis
  # 사설 배포 기준(코드서명 없음)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Education
