# electron-builder 패키징 설정 (담당 공동)
#
# appId 는 배포 후에도 절대 바꾸지 않는다 — OS 가 이 값(+productName)으로 앱을 식별하며,
# userData 경로(설정·API 키·자주쓰는질문 저장 위치)가 여기서 갈린다. 바꾸면 기존 사용자의
# 저장 데이터가 유실된 것처럼 보인다.
appId: com.nuance
productName: Nuance

directories:
  output: dist # 패키지 산출물(dmg/exe 등)
  buildResources: build # 아이콘 등 소스 에셋(build/icon.png)

# GitHub Releases 로 배포 + electron-updater 자동 업데이트 피드로 사용(2026-07-31, 사용자
# 요청). `electron-builder --publish always`(scripts: release:mac/release:win, 또는
# .github/workflows/release.yml)를 돌리면 이 저장소의 릴리스에 설치 파일 + latest.yml
# (Windows electron-updater 피드)을 자동으로 올린다. macOS는 zip 타깃을 안 쓰므로
# latest-mac.yml은 더 이상 생성되지 않는다(mac.target 주석 참고 — macOS는 electron-updater
# 자동 다운로드 자체를 안 씀, src/main/autoUpdate.ts). releaseType 을 draft 로 둬서,
# 빌드/업로드는 자동화하되 실제로 공개(Publish) 하는 건 GitHub 에서 릴리스 노트를
# 확인/작성한 뒤 사람이 마지막으로 누르게 한다 — 첫 배포라 빈 노트로 그대로 공개돼버리는
# 걸 방지.
publish:
  provider: github
  owner: madcamp-official
  repo: JoJo
  releaseType: draft

# 패키지에 포함할 파일 — electron-vite 산출물(out/**), package.json, 로컬 사전 번들(resources/**,
# scripts/ensure-resources.sh 로 생성됨). resources/** 가 빠지면 asarUnpack 대상 자체가 없어서
# JMdict/OEWN/CC-CEDICT 사전 조회가 배포판에서 전부 실패한다(2026-07-30 실측으로 확인된 버그).
files:
  - out/**/*
  - package.json
  - resources/**

# 사전 데이터는 용량이 크고(94MB) 텍스트/JSON 이라 asar 압축 이점이 없어 압축 해제 상태로 둔다
# (코드가 __dirname 기준 상대경로로 읽는데, asar 안에 있으면 fs 가 asar 를 투명하게 가로채 동일한
# 상대경로로 자동 리다이렉트해주므로 코드 변경 없이 그대로 동작한다).
asarUnpack:
  - resources/**

# Python 엔진(레이아웃 감지/OCR) — CI(release.yml)가 빌드 직전에
# scripts/setup-python-runtime.mjs 로 python/runtime, python/runtime-ndlocr 를 만들어둔다
# (2026-07-31, GitHub Release 배포에 Python 엔진 포함시키며 추가). asarUnpack 이 아니라
# extraResources 를 쓰는 이유 — venv/배포판 안의 실행 파일(python.exe 등)은 asar 안에서
# spawn 할 수 없어서 애초에 asar 밖(resources/ 바로 밑)에 둬야 한다. .venv*/는 사람이
# 로컬 개발용으로만 만드는 것(python/README.md)이라 여기서 제외 — 패키징에는 CI가 만든
# runtime*/ 만 들어간다(pythonServer.ts: PYTHON_ROOT 참고).
extraResources:
  - from: python
    to: python
    filter:
      - '**/*'
      - '!.venv/**'
      - '!.venv-ndlocr-test/**'
      - '!__pycache__/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  # 트레이/창 아이콘 런타임 파일(2026-07-31, 실사용 확인 — 트레이 아이콘이 안 보이고
  # 창 아이콘 화질이 깨지던 문제). buildResources(build/)는 electron-builder 가 .ico/.icns
  # 를 만드는 "빌드 시점 소스"로만 쓰고 앱에 자동으로 안 들어간다 — windows.ts 의
  # resolveIconPath/resolveMacTrayIconPath 가 런타임에 nativeImage.createFromPath 로 직접
  # 읽는 파일이라 별도로 extraResources 에 넣어줘야 한다.
  - from: build/icon.png
    to: build/icon.png
  - from: build/icon-tray-mac.png
    to: build/icon-tray-mac.png

mac:
  target:
    # zip은 electron-updater(Squirrel.Mac)가 자동 업데이트 다운로드에 쓰는 포맷인데,
    # 미서명 사설 배포라 그 경로 자체를 안 쓴다(src/main/autoUpdate.ts: macOS는 GitHub
    # API로 태그만 확인해 알림만 띄움) — dmg와 내용이 같은 962MB짜리 zip을 매 릴리스마다
    # 같이 만들 이유가 없어 뺐다(2026-07-31, 사용자 확인).
    - dmg
  category: public.app-category.education
  # 사설 배포(코드서명 인증서 없음) 기준. 정식 배포 시 hardenedRuntime+notarize 로 전환.
  identity: null

# identity: null이라 electron-builder 자체는 최종 .app을 서명하지 않고 넘기는데, 그 결과
# 물을 실제로 설치해보면 "확인되지 않은 개발자"가 아니라 훨씬 심한 "will damage your
# computer"(우회 옵션 없음) 경고가 떴다(2026-07-31 실사용 확인) — resign-electron.mjs가
# 이미 진단한 것과 같은 원인(Apple이 이 Electron 버전 원본 서명을 폐기)이 최종 배포판에는
# 재서명이 안 돼 그대로 남아있었기 때문. scripts/afterSign-mac.cjs가 패키징 직후 최종
# .app을 ad-hoc으로 다시 서명해 이 무효 서명을 새 CDHash로 덮어써 해결한다(스크립트 상단
# 주석 참고).
afterSign: scripts/afterSign-mac.cjs

win:
  target:
    - nsis
  # 사설 배포 기준(코드서명 없음)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Education
